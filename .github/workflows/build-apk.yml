name: Build BYD Car Qianqian APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android NDK & CMake
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "Using Android NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Core (.so) for BYD DiLink 32/64-bit
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - name: Build Signed Debug APK with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/byd-qianqian-player-v1.1.0.apk

      - name: Upload BYD Car Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd-qianqian-player-v1.1.0
          path: release-apk/byd-qianqian-player-v1.1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.1.0-release
          name: "比亚迪千千静听车机版 v1.1.0 车规增强版"
          body: |
            ### 🚗 比亚迪「千千静听」车规级 Hi-Fi 播放器 v1.1.0 升级发布
            
            **本次 v1.1.0 车规增强亮点**：
            - **USB U盘热插拔实时扫描**：插拔 U 盘即刻自动扫描新增无损曲目与同名 `.lrc` 歌词，屏幕顶部实时弹出发现提示。
            - **车规级熄火记忆持久化**：每 5 秒自动持久化当前曲目、毫秒级进度、丹拿/帝瓦雷 DSP 预设与播放模式，ACC 断电再上电精准续播。
            - **迷你桌面悬浮控条**：高德地图全屏导航时，悬浮歌词升级为可双轴自由拖拽的金属蓝迷你控条，集成盲操 `⏮ / ⏯ / ⏭ / ✕` 按钮。
            - **播放模式切换 & 蓝牙防爆音**：新增列表循环 / 单曲循环 / 随机播放 / 顺序播放一键切换，并增加 `ACTION_AUDIO_BECOMING_NOISY` 音频通道断开保护与方向盘物理媒体键 `KeyEvent` 深度响应。
            - **熊猫车机小迪语音接管**：持续支持「你好小迪，播放音乐 / 播放晴天 / 下一首」系统广播拦截与无障碍接管。
          files: release-apk/byd-qianqian-player-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

