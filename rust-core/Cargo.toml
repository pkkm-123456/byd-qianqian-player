[package]
name = "qianqian_core"
version = "1.0.0"
edition = "2021"

[lib]
name = "qianqian_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
symphonia = { version = "0.5", features = ["all"] }
fft-convolver = "0.1"
rustfft = "6.2"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
encoding_rs = "0.8"
pinyin = "0.10"
once_cell = "1.19"
